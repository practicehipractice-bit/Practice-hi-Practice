<div class="wrap"><div class="card"><div class="top"><a class="btn" href="index.html">← Home</a><button class="btn green" id="download">📥 Selected Questions Excel Download</button><button class="btn red" id="clear">🗑 सभी Selected हटाएँ</button><span class="count" id="count">0 प्रश्न</span></div></div><div class="card"><h2>⭐ Selected Questions</h2><div id="list"></div></div><script>
const KEY='PHP_SELECTED_QUESTIONS_V1';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function save(a){localStorage.setItem(KEY,JSON.stringify(a));}
function render(){const a=load(),list=document.getElementById('list');document.getElementById('count').textContent=a.length+' प्रश्न';if(!a.length){list.innerHTML='<div class="empty">अभी कोई प्रश्न Selected नहीं है।<br>Pre-Uploaded Set में ⭐ Select करें।</div>';return}list.innerHTML=a.map((r,i)=>`<div class="qitem"><div class="qtitle">${i+1}. ${esc(r.q)}</div><div class="opts"><div class="opt">A) ${esc(r.a)}</div><div class="opt">B) ${esc(r.b)}</div><div class="opt">C) ${esc(r.c)}</div><div class="opt">D) ${esc(r.d)}</div></div><div class="meta">सही उत्तर: ${esc(r.ans||'')} ${r.subject?' | Subject: '+esc(r.subject):''} ${r.setNo?' | Set: '+esc(String(r.setNo)):''}</div><button class="btn red" style="margin-top:9px;padding:7px 10px" onclick="removeOne(${i})">इस प्रश्न को हटाएँ</button></div>`).join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function removeOne(i){const a=load();a.splice(i,1);save(a);render()}
document.getElementById('clear').onclick=()=>{if(confirm('क्या सभी Selected Questions हटाएँ?')){save([]);render()}};
document.getElementById('download').onclick=()=>{const a=load();if(!a.length){alert('पहले कम-से-कम एक Question Select करें।');return}if(typeof XLSX==='undefined'){alert('Excel library load नहीं हुई। Internet चालू करके फिर प्रयास करें।');return}const data=a.map((r,i)=>({Question:r.q,'Option A':r.a,'Option B':r.b,'Option C':r.c,'Option D':r.d,'Correct Answer':r.ans||'','Subject':r.subject||'','Description':r.desc||'','Source Set':r.setNo||''}));const ws=XLSX.utils.json_to_sheet(data);ws['!cols']=[{wch:55},{wch:28},{wch:28},{wch:28},{wch:28},{wch:18},{wch:20},{wch:45},{wch:12}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Selected Questions');XLSX.writeFile(wb,'Practice_Hi_Practice_Selected_Questions.xlsx')};
render();</script></body></html>
