<div class="wrap"><div class="card"><div class="top"><a class="btn" href="index.html">← Home</a><button class="btn green" id="download">📥 Selected Questions Excel Download</button><button class="btn red" id="clear">🗑 सभी Selected हटाएँ</button><span class="count" id="count">0 प्रश्न</span></div></div><div class="card"><h2>⭐ Selected Questions</h2><div id="list"></div></div><script>
const KEY='PHP_SELECTED_QUESTIONS_V1';

function load(){
  try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}
}
function save(a){localStorage.setItem(KEY,JSON.stringify(a));}

function esc(v){
  return String(v==null?'':v).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function render(){
  const a=load(), list=document.getElementById('list');
  document.getElementById('count').textContent=a.length+' प्रश्न';
  if(!a.length){
    list.innerHTML='<div class="empty">अभी कोई प्रश्न Selected नहीं है।<br>Pre-Uploaded Set में ⭐ Select करें।</div>';
    return;
  }
  list.innerHTML=a.map((r,i)=>`
    <div class="qitem">
      <div class="qtitle">${i+1}. ${esc(r.q)}</div>
      <div class="opts">
        <div class="opt">A) ${esc(r.a)}</div>
        <div class="opt">B) ${esc(r.b)}</div>
        <div class="opt">C) ${esc(r.c)}</div>
        <div class="opt">D) ${esc(r.d)}</div>
      </div>
      <div class="meta">Answer: ${esc(r.ans)}${r.subject?' | Subject: '+esc(r.subject):''}</div>
      ${r.desc?'<div class="meta">'+esc(r.desc)+'</div>':''}
    </div>`).join('');
}



document.getElementById('clear').onclick=function(){
  if(!load().length)return;
  if(confirm('क्या सभी Selected Questions हटाएँ?')){
    save([]);
    render();
  }
};

render();

function u8(s){ return new TextEncoder().encode(s); }
function crc32(bytes){
  let c=0xffffffff;
  for(let i=0;i<bytes.length;i++){
    c ^= bytes[i];
    for(let k=0;k<8;k++) c=(c>>>1)^((c&1)?0xedb88320:0);
  }
  return (c^0xffffffff)>>>0;
}
function le16(n){ return new Uint8Array([n&255,(n>>>8)&255]); }
function le32(n){ return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]); }
function concatBytes(parts){
  let total=parts.reduce((n,p)=>n+p.length,0), out=new Uint8Array(total), off=0;
  for(const p of parts){ out.set(p,off); off+=p.length; }
  return out;
}
function zipStore(entries){
  const local=[], central=[];
  let offset=0;
  for(const e of entries){
    const name=u8(e.name), data=u8(e.data), crc=crc32(data);
    const lh=concatBytes([
      new Uint8Array([0x50,0x4b,0x03,0x04]), le16(20), le16(0), le16(0),
      le16(0), le16(0), le32(crc), le32(data.length), le32(data.length),
      le16(name.length), le16(0), name, data
    ]);
    local.push(lh);
    const ch=concatBytes([
      new Uint8Array([0x50,0x4b,0x01,0x02]), le16(20), le16(20), le16(0), le16(0),
      le16(0), le16(0), le32(crc), le32(data.length), le32(data.length),
      le16(name.length), le16(0), le16(0), le16(0), le16(0), le32(0), le32(offset),
      name
    ]);
    central.push(ch);
    offset += lh.length;
  }
  const cd=concatBytes(central), body=concatBytes(local);
  const end=concatBytes([
    new Uint8Array([0x50,0x4b,0x05,0x06]), le16(0),le16(0),
    le16(entries.length),le16(entries.length),le32(cd.length),le32(body.length),
    le16(0)
  ]);
  return concatBytes([body,cd,end]);
}


document.getElementById('download').onclick=function(){
  const data=load();
  if(!data.length){
    alert('कोई Selected Question नहीं है।');
    return;
  }

  function xml(v){
    return String(v==null?'':v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
      .replace(/'/g,'&apos;');
  }

  const keys=['q','a','b','c','d','ans'];
  const rows=data.map((r,i)=>{
    const ansText=r.ans||'';
    const ansLetter=(ansText==='A'||ansText==='B'||ansText==='C'||ansText==='D')
      ? ansText
      : (String(ansText).match(/^([ABCD])(?:[.)]|$)/i)||[])[1]?.toUpperCase() || '';
    const vals=[r.q||'',r.a||'',r.b||'',r.c||'',r.d||'',ansText,ansLetter];
    const cells=vals.map((v,j)=>{
      const ref=String.fromCharCode(65+j)+(i+1);
      return '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xml(v)+'</t></is></c>';
    }).join('');
    return '<row r="'+(i+1)+'">'+cells+'</row>';
  }).join('');

  const sheet = "<worksheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\">\n<sheetPr><outlinePr summaryBelow=\"1\" summaryRight=\"1\"/><pageSetUpPr/></sheetPr>\n<dimension ref=\"A1:G1\"/>\n<sheetViews><sheetView workbookViewId=\"0\"/></sheetViews>\n<sheetFormatPr baseColWidth=\"8\" defaultRowHeight=\"15\"/>\n<cols>\n<col width=\"55\" customWidth=\"1\" min=\"1\" max=\"1\"/>\n<col width=\"30\" customWidth=\"1\" min=\"2\" max=\"5\"/>\n<col width=\"22\" customWidth=\"1\" min=\"6\" max=\"7\"/>\n</cols>\n<sheetData>\n__ROWS__\n</sheetData>\n</worksheet>".replace('__ROWS__',rows)
    .replace('A1:G1','A1:G'+data.length)

  const entries=[];
  Object.keys(XLSX_TEMPLATE_FILES).forEach(name=>entries.push({name:name,data:XLSX_TEMPLATE_FILES[name]}));
  entries.push({name:'xl/worksheets/sheet1.xml',data:sheet});

  const bytes=zipStore(entries);
  const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='Selected_Questions.xlsx';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
};
